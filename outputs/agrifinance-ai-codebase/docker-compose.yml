services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agrifinance
      POSTGRES_USER: agrifinance_user
      POSTGRES_PASSWORD: agrifinance_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro

  backend:
    build:
      context: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://agrifinance_user:agrifinance_password@postgres:5432/agrifinance
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - ai-service

  ai-service:
    build:
      context: ./ai-service
    ports:
      - "8000:8000"

volumes:
  postgres_data:
